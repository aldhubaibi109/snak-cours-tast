<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Remastered 3D</title>
    <style>
        :root {
            --bg: #0d1319;
            --panel: #1b2732;
            --accent: #2ecc71;
            --accent-dark: #27ae60;
            --food: #e74c3c;
            --text: #ecf0f1;
            --muted: #8fa3b0;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            background: radial-gradient(circle at 50% 0%, #1d2b38, var(--bg) 70%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            overflow: hidden;
            user-select: none;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.2rem, 3.4vw, 1.8rem);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
        }

        h1 span { color: var(--accent); }

        .hud {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat {
            min-width: 78px;
            padding: 6px 12px;
            background: var(--panel);
            border-radius: 9px;
            text-align: center;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .stat small {
            display: block;
            font-size: 0.62rem;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: var(--muted);
        }

        .stat b { font-size: 1.1rem; }

        #stage {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55), inset 0 0 0 2px rgba(255, 255, 255, 0.07);
        }

        #stage canvas { display: block; touch-action: none; }

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px;
            text-align: center;
            background: rgba(8, 13, 18, 0.8);
            backdrop-filter: blur(3px);
            line-height: 1.35;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.18s ease, visibility 0.18s;
        }

        .overlay.show { opacity: 1; visibility: visible; }

        .overlay h2 { margin: 0; font-size: clamp(1.2rem, 4.5vw, 1.9rem); letter-spacing: 1px; }
        .overlay p { margin: 0; color: var(--muted); font-size: 0.9rem; max-width: 34ch; }
        .overlay .final { font-size: 1rem; }
        .overlay .final b { color: var(--accent); font-size: 1.3rem; }

        button {
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 8px 14px;
            color: var(--text);
            background: var(--panel);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 9px;
            cursor: pointer;
            transition: transform 0.12s ease, background-color 0.15s;
        }

        button:hover { background: #26374a; transform: translateY(-1px); }
        button:active { transform: translateY(0); }

        button.primary {
            background: var(--accent-dark);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.35);
        }

        button.primary:hover { background: var(--accent); }

        button[aria-pressed="true"] {
            background: rgba(46, 204, 113, 0.16);
            border-color: var(--accent);
            color: var(--accent);
        }

        .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

        .hint { margin: 0; color: var(--muted); font-size: 0.8rem; text-align: center; }

        kbd {
            background: var(--panel);
            border-radius: 5px;
            padding: 1px 5px;
            font-family: inherit;
            font-size: 0.78rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #touch-pad { display: none; gap: 6px; }

        #touch-pad button { width: 50px; height: 42px; font-size: 1.05rem; }

        @media (hover: none) and (pointer: coarse) {
            #touch-pad { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(2, 42px); }
        }
    </style>
</head>
<body>

    <h1>Snake <span>Remastered</span> 3D</h1>

    <div class="hud">
        <div class="stat"><small>Score</small><b id="score">0</b></div>
        <div class="stat"><small>Best</small><b id="best">0</b></div>
        <div class="stat"><small>Length</small><b id="length">3</b></div>
        <div class="stat"><small>Speed</small><b id="speed">1.0x</b></div>
    </div>

    <div id="stage">
        <div class="overlay show" id="overlay">
            <h2 id="overlay-title">Loading…</h2>
            <p id="overlay-text">Fetching Three.js…</p>
            <p class="final" id="overlay-final" hidden></p>
            <button class="primary" id="overlay-btn">Play</button>
        </div>
    </div>

    <div class="controls">
        <button id="btn-start">Start / Pause</button>
        <button id="btn-difficulty" aria-pressed="false">Difficulty: Normal</button>
        <button id="btn-walls" aria-pressed="false">Walls: Solid</button>
        <button id="btn-camera" aria-pressed="true">Camera: Follow</button>
        <button id="btn-sound" aria-pressed="true">Sound: On</button>
    </div>

    <div id="touch-pad">
        <span></span><button data-dir="up">&#9650;</button><span></span>
        <button data-dir="left">&#9664;</button><button data-dir="down">&#9660;</button><button data-dir="right">&#9654;</button>
    </div>

    <p class="hint">
        <kbd>&#8592;</kbd><kbd>&#8593;</kbd><kbd>&#8594;</kbd><kbd>&#8595;</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to steer &middot;
        drag to orbit &middot; <kbd>P</kbd> pause &middot; <kbd>R</kbd> restart &middot; <kbd>M</kbd> mute
    </p>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
    "use strict";

    const COLS = 20;
    const ROWS = 20;
    const HALF = (COLS - 1) / 2;
    const SEG = 0.86;                 // segment size in world units
    const SEG_Y = 0.45;
    const BASE_STEP = 150;            // ms per move on Normal
    const MIN_STEP = 55;
    const SPEEDUP = 3.2;
    const STORAGE_KEY = "snakeRemastered3dBest";

    const DIFFICULTIES = [
        { name: "Easy", step: 190 },
        { name: "Normal", step: BASE_STEP },
        { name: "Hard", step: 105 }
    ];

    const DIRS = {
        up:    { x: 0,  z: -1 },
        down:  { x: 0,  z: 1 },
        left:  { x: -1, z: 0 },
        right: { x: 1,  z: 0 }
    };

    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlay-title");
    const overlayText = document.getElementById("overlay-text");
    const overlayFinal = document.getElementById("overlay-final");
    const overlayBtn = document.getElementById("overlay-btn");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const lengthEl = document.getElementById("length");
    const speedEl = document.getElementById("speed");
    const btnStart = document.getElementById("btn-start");
    const btnDifficulty = document.getElementById("btn-difficulty");
    const btnWalls = document.getElementById("btn-walls");
    const btnCamera = document.getElementById("btn-camera");
    const btnSound = document.getElementById("btn-sound");

    // ------------------------------------------------------------------ audio
    // Synthesized with Web Audio: no assets to download, unlocked on first input.

    const Sound = (() => {
        const KEY = "snakeRemastered3dMuted";
        const VOLUME = 0.45;
        const AC = window.AudioContext || window.webkitAudioContext;
        let ac = null, master = null, noiseBuf = null;
        let muted = false;

        try { muted = localStorage.getItem(KEY) === "1"; } catch (err) { muted = false; }

        function init() {
            if (ac || !AC) return ac;
            ac = new AC();
            master = ac.createGain();
            master.gain.value = muted ? 0 : VOLUME;
            master.connect(ac.destination);
            noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.6), ac.sampleRate);
            const data = noiseBuf.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            return ac;
        }

        function unlock() {
            init();
            if (ac && ac.state === "suspended") ac.resume();
        }

        function tone(type, f0, f1, dur, gain, delay) {
            if (!ac || muted) return;
            const t0 = ac.currentTime + (delay || 0);
            const osc = ac.createOscillator();
            const g = ac.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(f0, t0);
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
            g.gain.setValueAtTime(0.0001, t0);
            g.gain.exponentialRampToValueAtTime(gain, t0 + Math.min(0.02, dur * 0.35));
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            osc.connect(g);
            g.connect(master);
            osc.start(t0);
            osc.stop(t0 + dur + 0.03);
        }

        function noiseHit(dur, gain, freq, delay) {
            if (!ac || muted) return;
            const t0 = ac.currentTime + (delay || 0);
            const src = ac.createBufferSource();
            src.buffer = noiseBuf;
            const filt = ac.createBiquadFilter();
            filt.type = "bandpass";
            filt.frequency.setValueAtTime(freq, t0);
            filt.Q.value = 0.9;
            const g = ac.createGain();
            g.gain.setValueAtTime(gain, t0);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            src.connect(filt);
            filt.connect(g);
            g.connect(master);
            src.start(t0);
            src.stop(t0 + dur + 0.03);
        }

        return {
            unlock,
            isMuted: () => muted,
            toggle() {
                muted = !muted;
                try { localStorage.setItem(KEY, muted ? "1" : "0"); } catch (err) { /* private mode */ }
                if (master) master.gain.value = muted ? 0 : VOLUME;
                if (!muted) { unlock(); this.ui(); }
                return muted;
            },
            ui() { tone("triangle", 900, 680, 0.06, 0.12); },
            turn() { tone("triangle", 1300, 1180, 0.035, 0.045); },
            eat(length) {
                const f = 470 + Math.min(length, 34) * 11;   // pitch climbs with the snake
                tone("square", f, f * 1.9, 0.1, 0.15);
                noiseHit(0.07, 0.09, 2400);
            },
            speedUp() {
                tone("square", 620, 645, 0.07, 0.12);
                tone("square", 830, 865, 0.07, 0.12, 0.07);
                tone("square", 1100, 1160, 0.12, 0.13, 0.14);
            },
            start() {
                tone("triangle", 440, 660, 0.12, 0.15);
                tone("triangle", 660, 990, 0.17, 0.14, 0.1);
            },
            pause() { tone("triangle", 520, 330, 0.14, 0.13); },
            resume() { tone("triangle", 330, 640, 0.13, 0.13); },
            death() {
                tone("sawtooth", 430, 70, 0.55, 0.2);
                tone("square", 250, 50, 0.62, 0.11, 0.04);
                noiseHit(0.35, 0.18, 800);
            }
        };
    })();

    function syncSoundBtn() {
        btnSound.textContent = "Sound: " + (Sound.isMuted() ? "Off" : "On");
        btnSound.setAttribute("aria-pressed", String(!Sound.isMuted()));
    }

    function showOverlay(title, text, button, final) {
        overlayTitle.textContent = title;
        overlayText.innerHTML = text;
        overlayBtn.textContent = button;
        overlayFinal.hidden = !final;
        if (final) overlayFinal.innerHTML = "Final score: <b>" + score + "</b> &middot; Best: <b>" + best + "</b>";
        overlay.classList.add("show");
    }

    if (typeof THREE === "undefined") {
        showOverlay("Could not load 3D engine", "Three.js failed to load from the CDN. Check your internet connection and reload.", "Reload");
        overlayBtn.addEventListener("click", () => location.reload());
        return;
    }

    // ------------------------------------------------------------------ state

    let snake, prevSnake, food, dir, queue, stepMs, score, best, alive, state, wrap, followCam;
    let difficulty = 1;
    let turnTimer = 0, spawnT = 0, deathT = 0, shake = 0, speedTier = 0;
    let bodyMeshes = [];
    let camYaw = 0, camPitch = 0.85, camDist = 15;
    let dragging = false, lastX = 0, lastY = 0;

    best = Number(localStorage.getItem(STORAGE_KEY) || 0) || 0;
    bestEl.textContent = best;

    // ------------------------------------------------------------------ scene

    const stage = document.getElementById("stage");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1117);
    scene.fog = new THREE.Fog(0x0b1117, 26, 52);

    const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 200);
    camera.position.set(0, 16, 14);

    let renderer;
    try {
        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    } catch (err) {
        showOverlay("WebGL unavailable", "Your browser or GPU could not create a WebGL context.", "Reload");
        overlayBtn.addEventListener("click", () => location.reload());
        return;
    }

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    stage.insertBefore(renderer.domElement, overlay);

    scene.add(new THREE.AmbientLight(0x9fc4ff, 0.55));

    const key = new THREE.DirectionalLight(0xffffff, 0.95);
    key.position.set(9, 18, 7);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.left = -16;
    key.shadow.camera.right = 16;
    key.shadow.camera.top = 16;
    key.shadow.camera.bottom = -16;
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 60;
    key.shadow.bias = -0.0015;
    scene.add(key);

    const rim = new THREE.DirectionalLight(0x59b0ff, 0.35);
    rim.position.set(-10, 6, -12);
    scene.add(rim);

    const floorMat = new THREE.MeshStandardMaterial({ color: 0x131c25, roughness: 0.95, metalness: 0.05 });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(COLS + 6, ROWS + 6), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(COLS, COLS, 0x3d5566, 0x223140);
    grid.position.y = 0.01;
    grid.material.transparent = true;
    grid.material.opacity = 0.7;
    scene.add(grid);

    const wallMat = new THREE.MeshStandardMaterial({
        color: 0x2c3e50, roughness: 0.25, metalness: 0.2,
        transparent: true, opacity: 0.55, emissive: 0x0a1622
    });

    const walls = new THREE.Group();
    const wallH = new THREE.BoxGeometry(COLS + 0.6, 1.3, 0.3);
    const wallV = new THREE.BoxGeometry(0.3, 1.3, ROWS + 0.6);
    for (const sign of [-1, 1]) {
        const a = new THREE.Mesh(wallH, wallMat);
        a.position.set(0, 0.65, sign * (HALF + 0.3));
        walls.add(a);
        const b = new THREE.Mesh(wallV, wallMat);
        b.position.set(sign * (HALF + 0.3), 0.65, 0);
        walls.add(b);
    }
    walls.visible = false;
    scene.add(walls);

    const segGeo = new THREE.BoxGeometry(SEG, SEG, SEG);
    const headGeo = new THREE.BoxGeometry(SEG * 1.12, SEG * 0.95, SEG * 1.12);
    const eyeGeo = new THREE.SphereGeometry(0.09, 10, 8);
    const pupilGeo = new THREE.SphereGeometry(0.05, 8, 6);
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.25, emissive: 0x333333 });
    const pupilMat = new THREE.MeshBasicMaterial({ color: 0x0a0f14 });

    const bodyMat = new THREE.MeshStandardMaterial({
        color: 0x27ae60, roughness: 0.35, metalness: 0.15,
        emissive: 0x0d3a22, emissiveIntensity: 1
    });
    const headMat = new THREE.MeshStandardMaterial({
        color: 0x4ce08a, roughness: 0.28, metalness: 0.18,
        emissive: 0x15703f, emissiveIntensity: 1
    });

    const head = new THREE.Group();
    const headMesh = new THREE.Mesh(headGeo, headMat);
    headMesh.castShadow = true;
    head.add(headMesh);
    for (const s of [-1, 1]) {
        const eye = new THREE.Mesh(eyeGeo, eyeMat);
        eye.position.set(0.22 * s, 0.2, SEG * 0.5);
        head.add(eye);
        const pupil = new THREE.Mesh(pupilGeo, pupilMat);
        pupil.position.set(0.22 * s, 0.2, SEG * 0.5 + 0.07);
        head.add(pupil);
    }
    head.position.y = SEG_Y;
    head.userData.rot = 0;
    scene.add(head);

    const foodMesh = new THREE.Mesh(
        new THREE.OctahedronGeometry(0.34),
        new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.25, metalness: 0.35, emissive: 0x7a1c12, emissiveIntensity: 1 })
    );
    foodMesh.castShadow = true;
    foodMesh.position.y = 0.7;
    scene.add(foodMesh);

    const foodHalo = new THREE.Mesh(
        new THREE.TorusGeometry(0.55, 0.045, 6, 24),
        new THREE.MeshBasicMaterial({ color: 0xe74c3c, transparent: true, opacity: 0.55 })
    );
    foodHalo.rotation.x = -Math.PI / 2;
    foodHalo.position.y = 0.03;
    scene.add(foodHalo);

    const foodLight = new THREE.PointLight(0xff5544, 1.4, 7);
    foodLight.position.y = 1;
    scene.add(foodLight);

    // pooled effects: eat rings + sparks
    const ringGeo = new THREE.TorusGeometry(0.5, 0.05, 6, 20);
    const rings = [];
    for (let i = 0; i < 6; i++) {
        const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0x2ecc71, transparent: true, opacity: 0 }));
        m.rotation.x = -Math.PI / 2;
        m.visible = false;
        scene.add(m);
        rings.push({ mesh: m, age: 0, life: 0.55 });
    }

    const sparkGeo = new THREE.BoxGeometry(0.11, 0.11, 0.11);
    const sparks = [];
    for (let i = 0; i < 48; i++) {
        const m = new THREE.Mesh(sparkGeo, new THREE.MeshBasicMaterial({ color: 0x7dffb0, transparent: true, opacity: 0 }));
        m.visible = false;
        scene.add(m);
        sparks.push({ mesh: m, vx: 0, vy: 0, vz: 0, age: 0, life: 0 });
    }

    function freeSpark() {
        for (const s of sparks) if (s.life === 0 || s.age >= s.life) return s;
        return sparks[0];
    }

    function burst(wx, wy, wz, color) {
        const ring = rings.find(r => r.age >= r.life) || rings[0];
        ring.age = 0;
        ring.life = 0.55;
        ring.mesh.visible = true;
        ring.mesh.position.set(wx, 0.04, wz);
        ring.mesh.material.color.setHex(color);

        for (let i = 0; i < 12; i++) {
            const s = freeSpark();
            const a = Math.random() * Math.PI * 2;
            const up = 3 + Math.random() * 4;
            s.age = 0;
            s.life = 0.5 + Math.random() * 0.4;
            s.mesh.visible = true;
            s.mesh.material.color.setHex(color);
            s.mesh.position.set(wx, wy, wz);
            s.vx = Math.cos(a) * (2 + Math.random() * 3);
            s.vz = Math.sin(a) * (2 + Math.random() * 3);
            s.vy = up;
        }
    }

    function updateEffects(dt) {
        for (const r of rings) {
            if (r.age >= r.life) continue;
            r.age += dt;
            const t = r.age / r.life;
            if (t >= 1) { r.mesh.visible = false; continue; }
            r.mesh.scale.setScalar(1 + t * 4.5);
            r.mesh.material.opacity = (1 - t) * 0.75;
        }

        for (const s of sparks) {
            if (s.life === 0 || s.age >= s.life) {
                if (s.mesh.visible) { s.mesh.visible = false; s.life = 0; }
                continue;
            }
            s.age += dt;
            s.vy -= 16 * dt;
            s.mesh.position.x += s.vx * dt;
            s.mesh.position.y += s.vy * dt;
            s.mesh.position.z += s.vz * dt;
            if (s.mesh.position.y < 0.05) { s.mesh.position.y = 0.05; s.vy *= -0.4; }
            s.mesh.rotation.x += dt * 8;
            s.mesh.rotation.y += dt * 6;
            s.mesh.material.opacity = Math.max(0, 1 - s.age / s.life);
        }
    }

    // ------------------------------------------------------------------ layout

    function resize() {
        const w = Math.max(240, Math.min(880, window.innerWidth - 32, window.innerHeight - 250));
        const size = Math.round(w);
        renderer.setSize(size, size, false);
        canvas.style.width = size + "px";
        canvas.style.height = size + "px";
        camera.aspect = 1;
        camera.updateProjectionMatrix();
    }

    const canvas = renderer.domElement;
    window.addEventListener("resize", resize);
    resize();

    // ------------------------------------------------------------------ logic

    const cellToWorldX = cx => cx - HALF;
    const cellToWorldZ = cz => cz - HALF;

    function reset() {
        const mid = Math.floor(ROWS / 2);
        snake = [{ x: 5, y: mid }, { x: 4, y: mid }, { x: 3, y: mid }];
        prevSnake = snake.map(p => ({ ...p }));
        dir = DIRS.right;
        queue = [];
        score = 0;
        alive = true;
        stepMs = DIFFICULTIES[difficulty].step;
        turnTimer = 0;
        deathT = 0;
        shake = 0;
        speedTier = 0;
        for (const m of bodyMeshes) scene.remove(m);
        bodyMeshes = [];
        placeFood();
        updateHud();
    }

    function start() {
        reset();
        state = "playing";
        overlay.classList.remove("show");
        Sound.start();
    }

    function togglePause() {
        if (state === "playing") {
            state = "paused";
            showOverlay("Paused", "Press P or hit resume below.", "Resume");
            Sound.pause();
        } else if (state === "paused") {
            state = "playing";
            overlay.classList.remove("show");
            Sound.resume();
        }
    }

    function gameOver() {
        alive = false;
        state = "over";
        deathT = 1;
        shake = 1;
        Sound.death();
        if (score > best) {
            best = score;
            localStorage.setItem(STORAGE_KEY, String(best));
        }
        updateHud();
        showOverlay("Game Over", "Length " + snake.length + " &middot; Score " + score, "Play Again", true);
    }

    function updateHud() {
        scoreEl.textContent = score;
        bestEl.textContent = best;
        lengthEl.textContent = snake.length;
        speedEl.textContent = (BASE_STEP / stepMs).toFixed(1) + "x";
    }

    function placeFood() {
        const free = [];
        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                if (!snake.some(p => p.x === x && p.y === y)) free.push({ x, y });
            }
        }
        food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
    }

    function queueDir(name) {
        const last = queue.length ? queue[queue.length - 1] : dir;
        const d = DIRS[name];
        if (d.x === -last.x && d.z === -last.z) return false;
        if (d.x === last.x && d.z === last.z) return false;
        if (queue.length >= 2) return false;
        queue.push(d);
        return true;
    }

    function stepOnce() {
        if (queue.length) dir = queue.shift();

        const head2 = { x: snake[0].x + dir.x, y: snake[0].y + dir.z };

        if (wrap) {
            head2.x = (head2.x + COLS) % COLS;
            head2.y = (head2.y + ROWS) % ROWS;
        } else if (head2.x < 0 || head2.x >= COLS || head2.y < 0 || head2.y >= ROWS) {
            gameOver();
            return;
        }

        prevSnake = snake.map(p => ({ ...p }));

        const ate = food && head2.x === food.x && head2.y === food.y;
        const limit = snake.length - (ate ? 0 : 1);
        for (let i = 0; i < limit; i++) {
            if (snake[i].x === head2.x && snake[i].y === head2.y) {
                gameOver();
                return;
            }
        }

        snake.unshift(head2);
        if (ate) {
            score += 10;
            prevSnake.push({ ...snake[snake.length - 1] });
            burst(cellToWorldX(food.x), 0.7, cellToWorldZ(food.y), 0x2ecc71);
            placeFood();
            stepMs = Math.max(MIN_STEP, stepMs - SPEEDUP);
            const tier = Math.floor((BASE_STEP - stepMs) / 25);
            if (tier > speedTier) {
                speedTier = tier;
                Sound.speedUp();
            }
            Sound.eat(snake.length);
            updateHud();
        } else {
            snake.pop();
        }
    }

    // ------------------------------------------------------------------ render

    function lerp(a, b, t) { return a + (b - a) * t; }

    function lerpAngle(a, b, t) {
        const TAU = Math.PI * 2;
        let d = (b - a) % TAU;
        if (d > Math.PI) d -= TAU;
        if (d < -Math.PI) d += TAU;
        return a + d * t;
    }

    function ensureBody(count, now) {
        while (bodyMeshes.length < count) {
            const g = new THREE.Group();
            const m = new THREE.Mesh(segGeo, bodyMat);
            m.castShadow = true;
            g.add(m);
            g.position.y = SEG_Y;
            g.userData.rot = 0;
            g.userData.birth = now;
            scene.add(g);
            bodyMeshes.push(g);
        }
    }

    function placeSegment(obj, i, alpha, now, speedT) {
        const to = snake[i];
        const from = prevSnake[Math.min(i, prevSnake.length - 1)] || to;
        const cx = lerp(from.x, to.x, alpha);
        const cz = lerp(from.y, to.y, alpha);
        obj.position.x = cellToWorldX(cx);
        obj.position.z = cellToWorldZ(cz);

        const dx = to.x - from.x;
        const dz = to.y - from.y;
        if (Math.abs(dx) === 1 || Math.abs(dz) === 1) {
            obj.userData.rot = lerpAngle(obj.userData.rot, Math.atan2(dx, dz), speedT);
        }
        obj.rotation.y = obj.userData.rot;

        if (obj.userData.birth !== undefined) {
            const age = (now - obj.userData.birth) / 260;
            if (age >= 1) {
                obj.userData.birth = undefined;
            } else {
                const e = 1 - Math.pow(1 - Math.min(1, Math.max(0, age)), 3);
                obj.scale.setScalar(0.25 + 0.75 * e);
            }
        }
    }

    function updateCamera(dt) {
        const hx = cellToWorldX(snake[0].x);
        const hz = cellToWorldZ(snake[0].y);

        const tx = followCam ? hx * 0.75 : 0;
        const tz = followCam ? hz * 0.75 : 0;

        const yaw = camYaw;
        const horiz = Math.cos(camPitch) * camDist;
        let cx = tx + Math.sin(yaw) * horiz;
        let cz = tz + Math.cos(yaw) * horiz;
        let cy = Math.sin(camPitch) * camDist;

        if (shake > 0) {
            const s = shake * 0.5;
            cx += (Math.random() - 0.5) * s;
            cy += (Math.random() - 0.5) * s;
            cz += (Math.random() - 0.5) * s;
        }

        const k = Math.min(1, dt * (followCam ? 4.5 : 3));
        camera.position.x = lerp(camera.position.x, cx, k);
        camera.position.y = lerp(camera.position.y, cy, k);
        camera.position.z = lerp(camera.position.z, cz, k);
        camera.lookAt(tx, 0.4, tz);
    }

    function render(dt, now) {
        const alpha = state === "playing" ? Math.min(1, turnTimer / stepMs) : 1;
        const speedT = Math.min(1, dt * 16);

        ensureBody(snake.length - 1, now);
        placeSegment(head, 0, alpha, now, speedT);
        for (let i = 1; i < snake.length; i++) placeSegment(bodyMeshes[i - 1], i, alpha, now, speedT);
        for (let j = snake.length - 1; j < bodyMeshes.length; j++) bodyMeshes[j].visible = false;
        for (let j = 0; j < snake.length - 1; j++) bodyMeshes[j].visible = true;

        if (food) {
            const fx = cellToWorldX(food.x);
            const fz = cellToWorldZ(food.y);
            foodMesh.visible = true;
            foodHalo.visible = true;
            foodLight.visible = true;
            foodMesh.position.set(fx, 0.7 + Math.sin(spawnT * 3) * 0.12, fz);
            foodMesh.rotation.y += dt * 1.9;
            foodMesh.rotation.x = 0.4;
            foodMesh.scale.setScalar(1 + Math.sin(spawnT * 5) * 0.08);
            foodHalo.position.set(fx, 0.04, fz);
            foodHalo.scale.setScalar(1 + Math.sin(spawnT * 4) * 0.16);
            foodHalo.material.opacity = 0.35 + Math.sin(spawnT * 4) * 0.15;
            foodLight.position.set(fx, 1.1, fz);
            foodLight.intensity = 1.2 + Math.sin(spawnT * 5) * 0.35;
        } else {
            foodMesh.visible = foodHalo.visible = foodLight.visible = false;
        }

        if (deathT > 0) {
            deathT = Math.max(0, deathT - dt * 1.2);
            const k = deathT;
            bodyMat.emissive.setRGB(0.05 + 0.85 * k, 0.22 * (1 - k), 0.13 * (1 - k));
            headMat.emissive.setRGB(0.08 + 0.9 * k, 0.44 * (1 - k), 0.25 * (1 - k));
        } else {
            bodyMat.emissive.setRGB(0.05, 0.22, 0.13);
            headMat.emissive.setRGB(0.08, 0.44, 0.25);
        }
        if (shake > 0) shake = Math.max(0, shake - dt * 1.5);

        walls.visible = !wrap;
        updateCamera(dt);
        updateEffects(dt);
        renderer.render(scene, camera);
    }

    // ------------------------------------------------------------------ loop

    let last = performance.now();

    function frame(now) {
        let dt = (now - last) / 1000;
        last = now;
        if (dt > 0.25) dt = 0.25;
        spawnT += dt;

        if (state === "playing") {
            turnTimer += dt * 1000;
            while (turnTimer >= stepMs && alive) {
                turnTimer -= stepMs;
                stepOnce();
            }
        }

        render(dt, now);
        requestAnimationFrame(frame);
    }

    // ------------------------------------------------------------------ input

    const KEYS = {
        ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
        w: "up", s: "down", a: "left", d: "right",
        W: "up", S: "down", A: "left", D: "right"
    };

    function steer(name) {
        if (state === "ready" || state === "over") start();
        if (queueDir(name)) Sound.turn();
    }

    document.addEventListener("keydown", e => {
        Sound.unlock();
        const name = KEYS[e.key];
        if (name) {
            e.preventDefault();
            steer(name);
            return;
        }
        if (e.key === "p" || e.key === "P" || e.code === "Space") {
            e.preventDefault();
            if (state === "ready" || state === "over") start();
            else togglePause();
        } else if (e.key === "r" || e.key === "R") {
            e.preventDefault();
            start();
        } else if (e.key === "m" || e.key === "M") {
            e.preventDefault();
            Sound.toggle();
            syncSoundBtn();
        }
    });

    let touchStart = null;
    canvas.addEventListener("touchstart", e => {
        Sound.unlock();
        const t = e.changedTouches[0];
        touchStart = { x: t.clientX, y: t.clientY };
    }, { passive: true });

    canvas.addEventListener("touchend", e => {
        if (!touchStart) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - touchStart.x;
        const dy = t.clientY - touchStart.y;
        touchStart = null;
        if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
        steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    }, { passive: true });

    // orbit with mouse / trackpad drag
    canvas.addEventListener("pointerdown", e => {
        Sound.unlock();
        dragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener("pointermove", e => {
        if (!dragging) return;
        camYaw -= (e.clientX - lastX) * 0.006;
        camPitch = Math.min(1.35, Math.max(0.18, camPitch + (e.clientY - lastY) * 0.005));
        lastX = e.clientX;
        lastY = e.clientY;
    });

    canvas.addEventListener("pointerup", () => { dragging = false; });
    canvas.addEventListener("pointercancel", () => { dragging = false; });
    canvas.addEventListener("wheel", e => {
        e.preventDefault();
        camDist = Math.min(34, Math.max(7, camDist + Math.sign(e.deltaY) * 1.2));
    }, { passive: false });

    document.querySelectorAll("#touch-pad button").forEach(b => {
        b.addEventListener("click", () => {
            Sound.unlock();
            steer(b.dataset.dir);
        });
    });

    overlayBtn.addEventListener("click", () => {
        Sound.unlock();
        if (state === "paused") togglePause();
        else start();
    });

    btnStart.addEventListener("click", () => {
        Sound.unlock();
        if (state === "ready" || state === "over") start();
        else togglePause();
    });

    btnDifficulty.addEventListener("click", () => {
        Sound.unlock();
        Sound.ui();
        difficulty = (difficulty + 1) % DIFFICULTIES.length;
        btnDifficulty.textContent = "Difficulty: " + DIFFICULTIES[difficulty].name;
        btnDifficulty.setAttribute("aria-pressed", String(difficulty !== 1));
        stepMs = DIFFICULTIES[difficulty].step;
        updateHud();
    });

    btnWalls.addEventListener("click", () => {
        Sound.unlock();
        Sound.ui();
        wrap = !wrap;
        btnWalls.textContent = "Walls: " + (wrap ? "Wrap" : "Solid");
        btnWalls.setAttribute("aria-pressed", String(wrap));
    });

    btnCamera.addEventListener("click", () => {
        Sound.unlock();
        Sound.ui();
        followCam = !followCam;
        btnCamera.textContent = "Camera: " + (followCam ? "Follow" : "Board");
        btnCamera.setAttribute("aria-pressed", String(followCam));
        if (followCam) camPitch = Math.min(1.35, Math.max(0.5, camPitch));
        else { camPitch = 0.95; camDist = 26; }
    });

    btnSound.addEventListener("click", () => {
        Sound.unlock();
        Sound.toggle();
        syncSoundBtn();
    });

    // ------------------------------------------------------------------ boot

    wrap = false;
    followCam = true;
    camYaw = 0.55;
    camPitch = 0.85;
    camDist = 15;
    reset();
    state = "ready";
    syncSoundBtn();
    showOverlay("Snake 3D", "Steer with arrows or WASD. Drag to orbit, scroll to zoom.", "Play");
    requestAnimationFrame(frame);
})();
</script>
</body>
</html>
