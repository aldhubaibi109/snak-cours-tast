<!DOCTYPE html>
<html>
<head>
    <title>3D Two-Lane Racing</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #uiLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        #scoreBoard { padding: 20px; color: white; font-size: 28px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        
        #gameOverScreen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.75); display: none; 
            flex-direction: column; justify-content: center; align-items: center; pointer-events: auto;
            z-index: 100;
        }
        h1 { color: #ff4757; font-size: 70px; margin: 0 0 10px 0; text-transform: uppercase; text-shadow: 0 0 20px rgba(255, 71, 87, 0.5); }
        p { color: white; font-size: 32px; margin: 0 0 40px 0; }
        button { 
            padding: 15px 40px; font-size: 24px; cursor: pointer; 
            background: #ff4757; color: white; border: none; border-radius: 8px; 
            font-weight: bold; text-transform: uppercase; transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        button:hover { background: #ff6b81; transform: scale(1.05); }
        
        #instructions { position: absolute; bottom: 30px; width: 100%; text-align: center; color: rgba(255,255,255,0.8); font-size: 20px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        
        /* Loading text before ThreeJS loads */
        #loading { position: absolute; top: 50%; width: 100%; text-align: center; color: white; font-size: 24px; z-index: -1;}
    </style>
</head>
<body>
    <div id="loading">Loading 3D Engine...</div>
    
    <div id="uiLayer">
        <div id="scoreBoard">SCORE: 0<br><span style="font-size:20px; color:#aaa;">SPEED: 100 MPH</span></div>
        <div id="instructions">Use <b>LEFT/RIGHT</b> arrows to switch lanes. Tap screen sides on mobile.</div>
    </div>
    
    <div id="gameOverScreen">
        <h1>CRASHED!</h1>
        <p id="finalScore">Final Score: 0</p>
        <button onclick="resetGame()">Play Again</button>
    </div>

    <!-- Include Three.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        document.getElementById('loading').style.display = 'none'; // Hide loading once script runs

        // Game State
        let score = 0;
        let speed = 1.0;
        let isGameOver = false;
        let lanePosition = 2.5; // X offset for lanes (Left: -2.5, Right: 2.5)
        
        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky blue background
        scene.fog = new THREE.Fog(0x87CEEB, 30, 120); // Add fog to blend the horizon

        // Camera setup (placed slightly behind and above the car)
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6, 12);
        camera.lookAt(0, 0, -20);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 10);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 50;
        dirLight.shadow.camera.bottom = -50;
        dirLight.shadow.camera.left = -50;
        dirLight.shadow.camera.right = 50;
        scene.add(dirLight);

        // Materials & Geometries
        
        // 1. Car Material (Player)
        const carGeo = new THREE.BoxGeometry(2.5, 1.2, 4.5);
        const playerMat = new THREE.MeshStandardMaterial({ 
            color: 0x2196F3, // Blue
            roughness: 0.2, 
            metalness: 0.5 
        });
        
        // 2. Enemy Material
        const enemyMat = new THREE.MeshStandardMaterial({ 
            color: 0xff4757, // Red
            roughness: 0.3,
            metalness: 0.2
        });
        
        // Player Car
        const playerCar = new THREE.Mesh(carGeo, playerMat);
        playerCar.position.set(-lanePosition, 0.6, 0); // Start in left lane
        playerCar.castShadow = true;
        scene.add(playerCar);

        // Add headlights to player car
        const headlight1 = new THREE.PointLight(0xffffff, 1, 40);
        headlight1.position.set(-1, 0, -2.5);
        playerCar.add(headlight1);
        
        const headlight2 = new THREE.PointLight(0xffffff, 1, 40);
        headlight2.position.set(1, 0, -2.5);
        playerCar.add(headlight2);

        // 3. Road
        const roadGeo = new THREE.PlaneGeometry(16, 300);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.z = -100;
        road.receiveShadow = true;
        scene.add(road);

        // 4. Grass / Environment
        const groundGeo = new THREE.PlaneGeometry(400, 400);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 1.0 }); // Dark green
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.1;
        ground.position.z = -100;
        ground.receiveShadow = true;
        scene.add(ground);

        // 5. Road Markings (Center dashes)
        const lines = [];
        const lineGeo = new THREE.PlaneGeometry(0.6, 6);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        for (let i = 0; i < 20; i++) {
            let line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.position.y = 0.02;
            line.position.z = -i * 12; // Spacing
            scene.add(line);
            lines.push(line);
        }

        // Enemies Array
        let enemies = [];
        let spawnTimer = 0;

        // Input Handling
        let targetLane = -lanePosition; // Left lane
        
        window.addEventListener('keydown', (e) => {
            if(isGameOver) return;
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') targetLane = -lanePosition;
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') targetLane = lanePosition;
        });
        
        // Touch / Click Support
        function handleTouch(e) {
            if(isGameOver) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            if (clientX < window.innerWidth / 2) targetLane = -lanePosition;
            else targetLane = lanePosition;
        }
        window.addEventListener('mousedown', handleTouch);
        window.addEventListener('touchstart', handleTouch, {passive: false});

        // Resize Handling
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        // Game Logic Functions
        function spawnEnemy() {
            const enemy = new THREE.Mesh(carGeo, enemyMat);
            const lane = Math.random() < 0.5 ? -lanePosition : lanePosition;
            enemy.position.set(lane, 0.6, -150); // Spawn far in the distance
            enemy.castShadow = true;
            enemy.receiveShadow = true;
            scene.add(enemy);
            enemies.push(enemy);
        }

        const scoreBoard = document.getElementById('scoreBoard');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreText = document.getElementById('finalScore');

        function update() {
            if (isGameOver) return;

            // 1. Move player smoothly between lanes (Lerp effect)
            playerCar.position.x += (targetLane - playerCar.position.x) * 0.15;
            
            // Add a slight tilt (roll) when changing lanes for realism
            playerCar.rotation.z = (playerCar.position.x - targetLane) * 0.05;

            // 2. Move road center lines
            for (let line of lines) {
                line.position.z += speed;
                if (line.position.z > 10) {
                    line.position.z -= 240; // loop back to the distance
                }
            }

            // 3. Spawn enemies dynamically based on speed
            spawnTimer += 1;
            let spawnRate = Math.max(30, 80 - speed * 15); 
            if (spawnTimer > spawnRate) {
                spawnEnemy();
                spawnTimer = 0;
            }

            // 4. Move enemies and check collisions
            for (let i = enemies.length - 1; i >= 0; i--) {
                let enemy = enemies[i];
                enemy.position.z += speed * 0.8; // Enemies drive slightly slower than your closing speed

                // Collision Detection (3D Box Overlap)
                let zDist = Math.abs(playerCar.position.z - enemy.position.z);
                let xDist = Math.abs(playerCar.position.x - enemy.position.x);
                
                // If they are close enough on Z and X axes
                if (zDist < 4.5 && xDist < 2.2) {
                    // CRASH!
                    isGameOver = true;
                    gameOverScreen.style.display = "flex";
                    finalScoreText.innerText = `Final Score: ${score}`;
                    return;
                }

                // Remove enemies that pass behind camera and add score
                if (enemy.position.z > 15) {
                    scene.remove(enemy);
                    enemies.splice(i, 1);
                    score += 1;
                    
                    // Increase speed slightly to increase difficulty
                    if (score % 4 === 0) {
                        speed += 0.1;
                    }
                    
                    let displaySpeed = Math.floor(speed * 100);
                    scoreBoard.innerHTML = `SCORE: ${score}<br><span style="font-size:20px; color:#aaa;">SPEED: ${displaySpeed} MPH</span>`;
                }
            }
        }

        // Render Loop
        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }

        // Reset function for Play Again button
        window.resetGame = function() {
            isGameOver = false;
            score = 0;
            speed = 1.0;
            targetLane = -lanePosition;
            playerCar.position.x = -lanePosition;
            playerCar.rotation.z = 0;
            
            // Remove old enemies
            for (let enemy of enemies) {
                scene.remove(enemy);
            }
            enemies = [];
            spawnTimer = 0;
            
            scoreBoard.innerHTML = `SCORE: 0<br><span style="font-size:20px; color:#aaa;">SPEED: 100 MPH</span>`;
            gameOverScreen.style.display = "none";
        }

        // Start Game
        animate();
    </script>
</body>
</html>
