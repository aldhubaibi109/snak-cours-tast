<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ecf0f1;
        }

        h1 {
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #game-container {
            position: relative;
        }

        canvas {
            background-color: #34495e;
            border: 4px solid #bdc3c7;
            border-radius: 5px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        #score-board {
            display: flex;
            justify-content: space-between;
            width: 400px;
            margin-bottom: 10px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        #game-over {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            backdrop-filter: blur(2px);
        }

        #game-over h2 {
            color: #e74c3c;
            font-size: 2.5rem;
            margin: 0 0 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        button {
            padding: 10px 20px;
            font-size: 1.2rem;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        button:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .controls {
            margin-top: 20px;
            text-align: center;
            color: #bdc3c7;
            background-color: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <h1>Classic Snake</h1>
    
    <div id="score-board">
        <div>Score: <span id="score">0</span></div>
        <div>High Score: <span id="high-score">0</span></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="game-over">
            <h2>Game Over!</h2>
            <button id="restart-btn">Play Again</button>
        </div>
    </div>

    <div class="controls">
        Use <b>Arrow Keys</b> or <b>W, A, S, D</b> to move
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("high-score");
        const gameOverScreen = document.getElementById("game-over");
        const restartBtn = document.getElementById("restart-btn");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        let gameLoop;
        let gameSpeed = 120;
        let isGameOver = false;

        highScoreElement.textContent = highScore;

        function initGame() {
            snake = [
                { x: 10, y: 10 },
            ];
            dx = 0;
            dy = 0;
            score = 0;
            gameSpeed = 120;
            isGameOver = false;
            scoreElement.textContent = score;
            gameOverScreen.style.display = "none";
            placeFood();
            
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, gameSpeed);
            draw();
        }

        function placeFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            // Ensure food doesn't spawn on snake
            for (let part of snake) {
                if (part.x === food.x && part.y === food.y) {
                    placeFood();
                    break;
                }
            }
        }

        function update() {
            if (isGameOver) return;

            // Move snake
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Check if moving (game started)
            if (dx === 0 && dy === 0) {
                draw();
                return;
            }

            // Wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // Self collision
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Eat food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                placeFood();
                // Increase speed slightly
                if (gameSpeed > 50) {
                    gameSpeed -= 3;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(update, gameSpeed);
                }
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = "#34495e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid (optional, for aesthetics)
            ctx.strokeStyle = "rgba(44, 62, 80, 0.5)";
            ctx.lineWidth = 1;
            for(let i=0; i<=tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Draw food (apple)
            ctx.fillStyle = "#e74c3c";
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // Draw snake
            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = i === 0 ? "#2ecc71" : "#27ae60";
                
                // Rounded corners for snake segments using standard arc/rect if roundRect is missing, but modern browsers support roundRect
                if (ctx.roundRect) {
                    ctx.beginPath();
                    ctx.roundRect(snake[i].x * gridSize + 1, snake[i].y * gridSize + 1, gridSize - 2, gridSize - 2, 4);
                    ctx.fill();
                } else {
                    ctx.fillRect(snake[i].x * gridSize + 1, snake[i].y * gridSize + 1, gridSize - 2, gridSize - 2);
                }
                
                // Draw eyes on the head
                if (i === 0) {
                    ctx.fillStyle = "white";
                    
                    let eyeOffsetX = 5;
                    let eyeOffsetY = 5;
                    
                    if (dx === 1) { // Right
                        ctx.fillRect(snake[i].x * gridSize + gridSize - 7, snake[i].y * gridSize + 4, 3, 3);
                        ctx.fillRect(snake[i].x * gridSize + gridSize - 7, snake[i].y * gridSize + gridSize - 7, 3, 3);
                    } else if (dx === -1) { // Left
                        ctx.fillRect(snake[i].x * gridSize + 4, snake[i].y * gridSize + 4, 3, 3);
                        ctx.fillRect(snake[i].x * gridSize + 4, snake[i].y * gridSize + gridSize - 7, 3, 3);
                    } else if (dy === 1) { // Down
                        ctx.fillRect(snake[i].x * gridSize + 4, snake[i].y * gridSize + gridSize - 7, 3, 3);
                        ctx.fillRect(snake[i].x * gridSize + gridSize - 7, snake[i].y * gridSize + gridSize - 7, 3, 3);
                    } else if (dy === -1) { // Up
                        ctx.fillRect(snake[i].x * gridSize + 4, snake[i].y * gridSize + 4, 3, 3);
                        ctx.fillRect(snake[i].x * gridSize + gridSize - 7, snake[i].y * gridSize + 4, 3, 3);
                    } else { // Idle
                        ctx.fillRect(snake[i].x * gridSize + gridSize - 7, snake[i].y * gridSize + 4, 3, 3);
                        ctx.fillRect(snake[i].x * gridSize + gridSize - 7, snake[i].y * gridSize + gridSize - 7, 3, 3);
                    }
                }
            }
        }

        function gameOver() {
            isGameOver = true;
            clearInterval(gameLoop);
            gameOverScreen.style.display = "flex";
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem("snakeHighScore", highScore);
                highScoreElement.textContent = highScore;
            }
        }

        document.addEventListener("keydown", (e) => {
            // Prevent default scrolling for arrow keys and space
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight", " "].indexOf(e.key) > -1) {
                e.preventDefault();
            }

            if ((e.key === "ArrowUp" || e.key === "w" || e.key === "W") && dy === 0) {
                dx = 0; dy = -1;
            } else if ((e.key === "ArrowDown" || e.key === "s" || e.key === "S") && dy === 0) {
                dx = 0; dy = 1;
            } else if ((e.key === "ArrowLeft" || e.key === "a" || e.key === "A") && dx === 0) {
                dx = -1; dy = 0;
            } else if ((e.key === "ArrowRight" || e.key === "d" || e.key === "D") && dx === 0) {
                dx = 1; dy = 0;
            }
        });

        restartBtn.addEventListener("click", initGame);

        // Start initial state
        initGame();

    </script>
</body>
</html>
